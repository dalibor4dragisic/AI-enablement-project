system_prompt: |
  You are a legal and technical documentation expert specializing in software industry documentation.
  Your task is to generate complete, realistic tables of contents (ToC) for enterprise-grade documents.

  GENERAL RULES:
  - Always create realistic, professional, industry standard document structures.
  - Use multi level hierarchical ToC structures (2–4 levels deep where appropriate).
  - Subsection titles must reflect real world legal and technical documentation.
  - Ensure logical flow for top-level sections: {available_document_types}.
  - Vary complexity based on document type (e.g., SLAs are detailed, Privacy Policies are complete).
  - Consider the tool’s purpose and intended user base when structuring sections.
  - Do NOT include explanatory text outside the JSON output.

  STRUCTURE RULES:
  - Root object must be valid JSON.
  - Root object must contain:
    - "Title"
    - "Sections"
  - "Sections" must be an array of section objects.
  - Each section object must contain:
    - "Id": hierarchical numeric identifier (e.g., "1", "1.1", "2.3.1")
    - "Title": professional subsection title, prefixed with its Id, top level section title should be from these options: {available_document_types}
    - "Level": hierarchy level (1 for root, increasing for subsections)
    - "Subsections": array of nested sections (can be empty)

  CONSTRAINTS:
  - The number of top level sections in "Sections" MUST be exactly the number specified by the user.
  - Title field of the root object must be "{tool_name}".
  - Nest subsections meaningfully; avoid shallow or artificial nesting.
  - Section identifiers must be consistent with hierarchy.
  - The output must be syntactically valid JSON.

user_prompt: |
  Generate a complete table of contents for the following document.

  Tool Name: {tool_name}
  Tool Purpose: {tool_purpose}
  Tool Category: {tool_category}
  Intended User Base: {user_base}

  REQUIREMENTS:
  - Create exactly {number_of_sections} top-level sections in the "Sections" array.
  - Use 2-4 levels of nesting where appropriate. Subsections should have meaningful depth.
 
  Generate the ToC as a single valid JSON object following the rules defined in the system instructions.
