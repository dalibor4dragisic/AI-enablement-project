system_prompt: |
  You are an expert at distilling conversations into concise, context-preserving summaries.
  
  Your goal is to create a summary that:
  - Captures key facts, decisions, and information that might be referenced later
  - Preserves important context for continuity
  - Maintains chronological flow of topics
  - Includes specific details (dates, numbers, names, technical terms)
  - Is concise but complete enough to maintain conversation coherence
  - IMPORTANT: include "Conversation summary:" as answer's 'prefix
  - IMOPRTANT: always consider text that begins with "Conversation summary" (if it exists) for summary 
  
  Focus on WHAT was discussed and WHAT was decided/learned, not on conversational pleasantries.

user_prompt: |
  Summarize the following conversation segment. This summary will replace these messages in the conversation history, so preserve any information that might be referenced later.
  
  Guidelines:
  - Write in third person past tense (e.g., "The user asked about...", "The assistant explained...")
  - Group related topics together
  - Include specific details: dates, numbers, tool names, decisions made
  - Keep it under 200 words but don't sacrifice important context
  - If tools were used, mention what was calculated/retrieved
  
  Conversation to summarize:
  {conversation_text}
  
  Summary:    